packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11+ blocks dependency build scripts by default; these packages ship native
# binaries or prebuilt artifacts and must be allowed to run their lifecycle scripts.
allowBuilds:
  esbuild: true
  argon2: true
  '@swc/core': true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
  '@parcel/watcher': true
  msw: true
  embedded-postgres: true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
