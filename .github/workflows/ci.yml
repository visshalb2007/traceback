name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.10.1'

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traceback
          POSTGRES_PASSWORD: traceback
          POSTGRES_DB: traceback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceback -d traceback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Present, so the integration suites run instead of skipping.
      TEST_DATABASE_URL: postgres://traceback:traceback@localhost:5432/traceback_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Proves the derived API document can still be produced.
      - run: pnpm openapi:generate

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @traceback/web test:e2e:install
      - run: pnpm --filter @traceback/web test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
