# Fly.io config for the web app. Deploy from the repo root:
#
#   fly launch --config fly.web.toml --no-deploy
#   fly deploy --config fly.web.toml
app = 'traceback-web'
primary_region = 'sin'

[build]
  dockerfile = 'apps/web/Dockerfile'

[build.args]
  # Inlined into the client bundle at build time; must be the public API URL.
  NEXT_PUBLIC_API_URL = 'https://traceback-api.fly.dev'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '20s'
  method = 'GET'
  path = '/'
